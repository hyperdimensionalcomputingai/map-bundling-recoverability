[project]
name = "bundling-reversibility"
version = "0.1.0"
description = "Readable MAP bundling and semantic retrieval experiments"
readme = "README.md"
authors = [
    { name = "prrao87", email = "prrao87@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "lancedb>=0.38.0",
    "matplotlib>=3.11.1",
    "ollama>=0.6.2",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "torch>=2.14.0",
    "torch-hd>=5.8.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.build-backend]
module-name = "experiment"
